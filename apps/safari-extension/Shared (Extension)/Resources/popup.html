<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="popup.css" rel="stylesheet">
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <main class="popup">
      <img alt="Teak" height="28" src="images/toolbar-icon.svg" width="28">
      <p class="title" id="title">Teak for Safari</p>
      <p class="message" id="message">Checking Safari...</p>
      <div class="actions" id="actions">
        <button class="primary" id="sign-in" type="button">Sign in</button>
        <button class="secondary" id="retry" type="button">Try again</button>
        <button class="secondary" id="sign-out" type="button">Sign out</button>
      </div>
    </main>
  </body>
</html>
