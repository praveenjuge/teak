<!doctype html>
<html lang="en">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta content="default-src 'self'" http-equiv="Content-Security-Policy">
    <meta
      content="width=device-width, initial-scale=1, user-scalable=no"
      name="viewport"
    >
    <link href="../Style.css" rel="stylesheet">
    <script defer src="../Script.js"></script>
  </head>
  <body>
    <main class="shell">
      <img alt="Teak" class="app-icon" height="64" src="../Icon.png" width="64">

      <section class="intro">
        <h1>Teak for Safari</h1>
      </section>

      <section aria-live="polite" class="account">
        <p class="account-status" id="account-status">Checking account...</p>
        <div class="actions">
          <button class="primary" id="sign-in" type="button">Sign in</button>
          <button class="secondary" id="sign-out" type="button">
            Sign out
          </button>
          <button
            class="secondary platform-mac"
            id="open-preferences"
            type="button"
          >
            Open Safari Settings
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
