questions:
  - id: install-cli
    question: How do I install the Teak command-line app?
    expected:
      - Install the teak-cli package globally, for example npm install -g teak-cli
    routes: /docs/cli

  - id: mcp-server-url
    question: What URL do I give my AI client to use Teak's MCP server?
    expected:
      - https://teakvault.com/mcp
    routes: /docs/mcp

  - id: connect-claude-code
    question: How do I connect Claude Code to my Teak library?
    expected:
      - claude mcp add --transport http teak https://teakvault.com/mcp
      - Complete browser sign-in when prompted
    routes: /docs/mcp

  - id: connect-claude-app
    question: How do I add Teak to Claude on the web, Desktop or my phone?
    expected:
      - Open Settings → Connectors in Claude and connect Teak, or add a custom connector with https://teakvault.com/mcp
      - Sign in to Teak when asked
    routes: /docs/mcp

  - id: claude-code-plugin
    question: Is there a Teak plugin for Claude Code, and what does it add?
    expected:
      - /plugin marketplace add praveenjuge/teak, then /plugin install teak@teak
      - It connects Teak's MCP server and adds /teak:save, /teak:search and /teak:recent
    routes: /docs/mcp

  - id: reconnect-after-sign-in-change
    question: My MCP client's browser sign-in to Teak stopped working. How do I fix it?
    expected:
      - Remove Teak from the MCP client, add it again, and sign in
      - Connections that use an API key keep working without changes
    routes: /docs/mcp

  - id: create-api-key
    question: Where do I create a Teak API key, and how many can I have?
    expected:
      - Settings → Integrations → API keys
      - Up to 10 active keys per account
    routes: /docs/api

  - id: api-authentication
    question: How do I authenticate requests to the Teak REST API?
    expected:
      - Send a bearer token in the Authorization header
      - The token is a teakapi_ API key or an OAuth access token
    routes: /docs/api

  - id: list-favorites-api
    question: How do I list my favorite cards with the REST API?
    expected:
      - GET /v1/cards with favorited=true
    routes: /docs/api

  - id: pin-cards
    question: How many cards can I pin to the top of my Teak library, and how do I pin one with the API?
    expected:
      - Up to 12 cards
      - PATCH /v1/cards/:cardId/pin with isPinned true
    routes: /docs/features

  - id: permanent-delete-api
    question: How do I permanently delete a card with the API, and can I undo it?
    expected:
      - DELETE /v1/cards/:cardId?permanent=true
      - It skips Trash and cannot be restored
    routes: /docs/api

  - id: upload-size-limit
    question: What is the largest file I can upload to Teak?
    expected:
      - 100 MB for ordinary file uploads
    routes: /docs/features

  - id: card-types
    question: What kinds of things can I save in Teak?
    expected:
      - Text, link, image, video, audio, document, palette, and quote cards
    routes: /docs/features

  - id: resave-link
    question: What happens if I save a link that's already in Teak, maybe with new tags?
    expected:
      - Teak makes no second card; the existing card moves to the top of the library and comes back from Archive if it was archived
      - Tags and notes sent with it aren't added to the existing card
      - The card's details keep Added as the first save date and show Saved again with the latest save
    routes: /docs/features

  - id: free-plan-limit
    question: How many cards can I save on the free plan, and what happens when I hit the limit in the Chrome extension?
    expected:
      - The free plan includes 200 cards
      - The extension popup shows an upgrade prompt instead of saving
    routes: /docs/extension

  - id: install-agent-skill
    question: How do I install the Teak agent skill?
    expected:
      - npx skills add praveenjuge/teak --skill teak
    routes: /docs/ai-agents

  - id: change-language
    question: Can I use Teak in German, and does search still work with is:fav?
    expected:
      - Choose Deutsch in Settings → Appearance → Language; the choice is saved to the account
      - Search qualifiers such as is:fav stay in English in every language
    routes: /docs/features

  - id: app-language
    question: My iPhone is set to Japanese. Can the Teak app be in Japanese too?
    expected:
      - Yes, choose 日本語 in the app's Settings → Language, or in iPhone Settings → Apps → Teak → Language
      - The choice is saved to the account, so the web and other devices follow it
    routes: /docs/features

  - id: ai-tags-language
    question: I saved a Japanese article. Will Teak's AI summary and tags be in English?
    expected:
      - No, summaries and AI tags are written in the language of the saved content, so Japanese
      - Items with no text, such as a photo without words, get English tags
    routes: /docs/features

  - id: sdk-typescript-client
    question: How do I call the Teak API from TypeScript?
    expected:
      - Install the teak-sdk package
      - Create a client with createTeakClient and a token provider, such as an API key
    routes: /docs/sdk

  - id: run-from-source
    question: How do I run Teak locally from its source code?
    expected:
      - Run bunx convex login, then bun run dev
      - It runs against Teak's shared development deployment, which needs access from the repository owner
    routes: /docs/development

  - id: tests-without-access
    question: Can I run Teak's tests without access to its development deployment?
    expected:
      - The unit tests run with bun run test
      - The end-to-end suite runs with bun run --cwd packages/tests e2e on its own local stack and needs no secrets
    routes: /docs/testing

  - id: new-api-operation
    question: What else ships with a new public API operation in Teak?
    expected:
      - The MCP tool, the SDK method and the CLI command, in the same pull request
      - A row in scripts/repo/public-parity.ts
    routes: /docs/adding-a-feature

  - id: add-ui-text
    question: I added English text to Teak's web app. What else do I need to do?
    expected:
      - Add the same key to all seven other language catalogs in the same pull request
      - Run bun test scripts/repo/i18n-catalog.test.ts
    routes: /docs/translating

  - id: self-hosted-cards-not-processed
    question: My self-hosted Teak saves cards but never processes them. What's missing?
    expected:
      - Put WORKFLOW_RPC_ROOT_SECRET on the Core Worker
      - Set the derived WORKFLOW_RPC_SECRET on the Convex deployment; until then background work stays queued
    routes: /docs/self-hosting
