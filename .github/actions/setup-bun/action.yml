name: Set up Bun
description: Installs the Bun version package.json pins (packageManager) and, when asked, the Node version it pins (engines.node).
inputs:
  node:
    description: Also set up the pinned Node.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
