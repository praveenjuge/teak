name: Mobile App Store Release
run-name: iOS ${{ inputs.version }} (${{ inputs.dry_run && 'dry run' || 'release' }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Patch version matching every package.json"
        required: true
        type: string
      dry_run:
        description: "Verify release readiness without building or mutating Apple state"
        required: true
        default: true
        type: boolean
concurrency:
  # App Store build numbers are allocated from app-wide ASC history, so keep
  # allocation through upload atomic even when different patch versions queue.
  group: mobile-app-store-ios-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  ASC_APP_ID: "6756574989"
  ASC_BYPASS_KEYCHAIN: "1"
  ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
  ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  ASC_NO_UPDATE: "1"
  ASC_VERSION: "3.6.1"
  APPLE_TEAM_ID: LW385M78LW
  EXPO_PUBLIC_CONVEX_SITE_URL: https://uncommon-ladybug-882.convex.site
  EXPO_PUBLIC_CONVEX_URL: https://uncommon-ladybug-882.convex.cloud
  EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
  IOS_APP_BUNDLE_ID: com.praveenjuge.teak
  IOS_EXTENSION_BUNDLE_ID: com.praveenjuge.teak.share-extension
  PLATFORM: IOS
  RELEASE_NOTES: "Small fixes and polish to keep saving and organizing your ideas smooth and reliable."
  VERSION: ${{ inputs.version }}
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      build_id: ${{ steps.build_state.outputs.build_id }}
      build_number: ${{ steps.build_state.outputs.build_number }}
      mutate: ${{ steps.release_state.outputs.mutate }}
      reuse: ${{ steps.build_state.outputs.reuse }}
      source_version: ${{ steps.release_state.outputs.source_version }}
      target_id: ${{ steps.release_state.outputs.target_id }}
      target_state: ${{ steps.release_state.outputs.target_state }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1.0.1
        with:
          cache: "false"
          version: ${{ env.ASC_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing App Store Connect credentials." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Verify release identity and canonical version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GITHUB_APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64 }}
          GITHUB_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_SENTRY_MOBILE_DSN: ${{ secrets.SENTRY_MOBILE_DSN }}
        run: |
          if [ -z "$GITHUB_APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$GITHUB_APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64" ] || [ -z "$GITHUB_SENTRY_AUTH_TOKEN" ] || [ -z "$GITHUB_SENTRY_MOBILE_DSN" ]; then
            echo "Missing iOS signing or Sentry release credentials." >&2
            exit 1
          fi
          node scripts/release-version.mjs lockstep "$VERSION"
          if [ "$DRY_RUN" != "true" ]; then
            release_tag="v$VERSION"
            tag_commit="$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)"
            if [ -z "$tag_commit" ]; then
              echo "A real release requires the existing $release_tag tag." >&2
              exit 1
            fi
            case "$GITHUB_REF" in
              "refs/tags/$release_tag")
                if [ "$tag_commit" != "$GITHUB_SHA" ]; then
                  echo "$release_tag resolved to an unexpected commit." >&2
                  exit 1
                fi
                ;;
              refs/heads/main)
                git fetch origin main
                if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ] || ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
                  echo "A recovery release must run at the current origin/main commit descending from $release_tag." >&2
                  exit 1
                fi
                echo "- Recovery source: current main $GITHUB_SHA (descends from $release_tag at $tag_commit)" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "A real release may run only from $release_tag or current main, not $GITHUB_REF." >&2
                exit 1
                ;;
            esac
          fi
          expo_version="$(cd apps/mobile && bunx expo config --type public --json | jq -r '.version')"
          if [ "$expo_version" != "$VERSION" ]; then
            echo "Expo resolved $expo_version, expected root package version $VERSION." >&2
            exit 1
          fi
          xcode_version="$(xcodebuild -version)"
          if [[ "$xcode_version" != Xcode\ 26.* ]]; then
            echo "The pinned macos-26 release image must provide Xcode 26.x." >&2
            exit 1
          fi
          echo "$xcode_version"
          pod --version
          asc auth status --validate --output table
          asc_version="$(asc --version | awk '{print $1}')"
          if [ "$asc_version" != "$ASC_VERSION" ]; then
            echo "asc $ASC_VERSION is required; found $asc_version." >&2
            exit 1
          fi

      - name: Resolve current Apple release state
        id: release_state
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          versions_json="$RUNNER_TEMP/ios-versions.json"
          for attempt in 1 2 3; do
            if asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --paginate --output json > "$versions_json"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

          result="$(node scripts/apple-latest-review.mjs apply "$versions_json" "$VERSION" "$ASC_APP_ID" "$PLATFORM" "$DRY_RUN")"
          target_id="$(jq -r '.targetId' <<< "$result")"
          target_state="$(jq -r '.targetState' <<< "$result")"
          source_version="$(jq -r '.sourceVersion' <<< "$result")"
          mutate="$(jq -r '.mutate' <<< "$result")"
          {
            echo "target_id=$target_id"
            echo "target_state=$target_state"
            echo "source_version=$source_version"
            echo "mutate=$mutate"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### iOS $([ "$DRY_RUN" = "true" ] && echo 'dry run' || echo 'latest-review release')"
            echo "- Target: $VERSION (${target_state:-not created})"
            echo "- Superseded: $(jq -r 'if .supersededId == "" then "none" else "\(.supersededVersion) (\(.supersededState)); cancel=\(.cancelSuperseded), remove=\(.removeSuperseded), promote=\(.promoteSuperseded)" end' <<< "$result")"
            echo "- Metadata source: ${source_version:-not found}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse an exact valid build or allocate the next Apple build number
        id: build_state
        if: steps.release_state.outputs.mutate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exact_builds="$RUNNER_TEMP/apple-ios-exact-builds.json"
          asc builds list \
            --app "$ASC_APP_ID" \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --processing-state VALID \
            --exclude-expired \
            --sort=-uploadedDate \
            --limit 1 \
            --output json > "$exact_builds"
          build_id="$(jq -r '.data[0].id // empty' "$exact_builds")"
          build_number="$(jq -r '.data[0].attributes.version // empty' "$exact_builds")"
          manifest="$RUNNER_TEMP/ios-reuse-manifest.json"
          manifest_name="teak-ios-$VERSION-app-store.json"

          if [ -n "$build_id" ] && gh release download "v$VERSION" --pattern "$manifest_name" --output "$manifest" 2>/dev/null; then
            if ! jq -e --arg id "$build_id" --arg number "$build_number" \
              '.build.id == $id and .build.number == $number and .artifact.sha256 != "" and .sentrySizeAnalysis == "success"' "$manifest" > /dev/null; then
              echo "The canonical iOS manifest does not prove the exact reusable build." >&2
              exit 1
            fi
            reuse=true
            echo "Reusing manifest-proven VALID App Store Connect build $build_id ($VERSION/$build_number)."
          else
            reuse=false
            build_id=""
            all_builds="$RUNNER_TEMP/apple-ios-all-builds.json"
            asc builds list --app "$ASC_APP_ID" --platform "$PLATFORM" --paginate --output json > "$all_builds"
            build_number="$(node scripts/apple-build-number.mjs "$all_builds")"
            asc builds next-build-number --app "$ASC_APP_ID" --platform "$PLATFORM" --output json > "$RUNNER_TEMP/ios-asc-next-build.json"
            asc_build_number="$(jq -r '.nextBuildNumber // .buildNumber // .data.nextBuildNumber // empty' "$RUNNER_TEMP/ios-asc-next-build.json")"
            if [ -z "$asc_build_number" ] || [ "$asc_build_number" != "$build_number" ]; then
              echo "asc next-build-number returned ${asc_build_number:-nothing}; deterministic allocation expected $build_number." >&2
              exit 1
            fi
            if ! [[ "$build_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Could not allocate a positive integer iOS build number from App Store Connect." >&2
              exit 1
            fi
          fi
          {
            echo "reuse=$reuse"
            echo "build_id=$build_id"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare iOS distribution certificate and secure temporary keychain with asc
        id: signing
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64" ]; then
            echo "Missing iOS signing credentials." >&2
            exit 1
          fi

          private_key="$RUNNER_TEMP/apple-distribution-private-key.pem"
          csr="$RUNNER_TEMP/apple-distribution.csr"
          printf '%s' "$APPLE_DISTRIBUTION_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key"
          chmod 600 "$private_key"
          openssl req -new -key "$private_key" -out "$csr" -subj "/CN=Teak iOS Distribution/O=$APPLE_TEAM_ID/C=US"
          private_hash="$(openssl pkey -in "$private_key" -pubout -outform DER | shasum -a 256 | awk '{print $1}')"

          asc certificates list --certificate-type IOS_DISTRIBUTION --paginate > "$RUNNER_TEMP/ios-certificates.json"
          certificate_id=""
          certificate_path="$RUNNER_TEMP/ios-distribution.pem"
          while IFS= read -r row; do
            candidate_id="$(jq -r '.id' <<< "$row")"
            content="$(jq -r '.attributes.certificateContent // empty' <<< "$row")"
            if [ -z "$content" ]; then continue; fi
            candidate="$RUNNER_TEMP/ios-${candidate_id}.cer"
            printf '%s' "$content" | base64 --decode > "$candidate"
            candidate_hash="$(openssl x509 -inform DER -in "$candidate" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')"
            if [ "$candidate_hash" = "$private_hash" ]; then
              certificate_id="$candidate_id"
              openssl x509 -inform DER -in "$candidate" -out "$certificate_path"
              break
            fi
          done < <(jq -c '.data[]?' "$RUNNER_TEMP/ios-certificates.json")

          if [ -z "$certificate_id" ]; then
            asc certificates create --certificate-type IOS_DISTRIBUTION --csr "$csr" > "$RUNNER_TEMP/ios-certificate-create.json"
            certificate_id="$(jq -r '.data.id // .id // empty' "$RUNNER_TEMP/ios-certificate-create.json")"
            content="$(jq -r '.data.attributes.certificateContent // .attributes.certificateContent // empty' "$RUNNER_TEMP/ios-certificate-create.json")"
            printf '%s' "$content" | base64 --decode | openssl x509 -inform DER -out "$certificate_path"
          fi
          if [ -z "$certificate_id" ] || [ ! -s "$certificate_path" ]; then
            echo "Could not resolve the iOS distribution certificate with asc." >&2
            exit 1
          fi

          identity="$(openssl x509 -in "$certificate_path" -noout -subject -nameopt multiline | awk -F'= ' '/commonName/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "Could not resolve the matched iOS certificate identity." >&2
            exit 1
          fi
          distribution_p12="$RUNNER_TEMP/ios-distribution.p12"
          openssl pkcs12 -legacy -export -inkey "$private_key" -in "$certificate_path" -out "$distribution_p12" -passout "pass:$APPLE_CERTIFICATE_PASSWORD" -name "$identity"

          keychain="$RUNNER_TEMP/teak-ios-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$distribution_p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          {
            echo "certificate_id=$certificate_id"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse exact iOS provisioning profiles with asc
        id: profiles
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        env:
          CERTIFICATE_ID: ${{ steps.signing.outputs.certificate_id }}
        run: |
          asc bundle-ids list --paginate > "$RUNNER_TEMP/ios-bundle-ids.json"
          asc profiles list --profile-type IOS_APP_STORE --profile-state ACTIVE --paginate > "$RUNNER_TEMP/ios-profiles.json"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"

          ensure_profile() {
            local identifier="$1" label="$2" output_prefix="$3"
            local bundle_id
            bundle_id="$(jq -r --arg identifier "$identifier" '.data[] | select(.attributes.identifier == $identifier and (.attributes.platform == "IOS" or .attributes.platform == "UNIVERSAL")) | .id' "$RUNNER_TEMP/ios-bundle-ids.json" | head -1)"
            if [ -z "$bundle_id" ]; then
              echo "Missing exact iOS bundle ID: $identifier" >&2
              exit 1
            fi
            profile_name="$label ${CERTIFICATE_ID: -8}"
            profile_id="$(jq -r --arg name "$profile_name" '.data[] | select(.attributes.name == $name and .attributes.profileState == "ACTIVE") | .id' "$RUNNER_TEMP/ios-profiles.json" | head -1)"
            if [ -z "$profile_id" ]; then
              asc profiles create \
                --name "$profile_name" \
                --profile-type IOS_APP_STORE \
                --bundle "$bundle_id" \
                --certificate "$CERTIFICATE_ID" > "$RUNNER_TEMP/${output_prefix}-profile-create.json"
              profile_id="$(jq -r '.data.id // .id // empty' "$RUNNER_TEMP/${output_prefix}-profile-create.json")"
            fi
            profile_path="$RUNNER_TEMP/${output_prefix}.mobileprovision"
            asc profiles download --id "$profile_id" --output "$profile_path" > "$RUNNER_TEMP/${output_prefix}-profile-download.json"
            plist="$RUNNER_TEMP/${output_prefix}-profile.plist"
            security cms -D -i "$profile_path" > "$plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            resolved_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            if [ "$application_identifier" != "$APPLE_TEAM_ID.$identifier" ]; then
              echo "Provisioning profile identity mismatch for $identifier." >&2
              exit 1
            fi
            cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
            echo "${output_prefix}_name=$resolved_name" >> "$GITHUB_OUTPUT"
          }

          ensure_profile "$IOS_APP_BUNDLE_ID" "Teak iOS App" "app"
          ensure_profile "$IOS_EXTENSION_BUNDLE_ID" "Teak iOS Share Extension" "extension"

      - name: Generate the native iOS project and install pods locally
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        working-directory: apps/mobile
        env:
          APPLE_DISTRIBUTION_IDENTITY: ${{ steps.signing.outputs.identity }}
          IOS_APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_name }}
          IOS_EXTENSION_PROFILE_NAME: ${{ steps.profiles.outputs.extension_name }}
          TEAK_IOS_BUILD_NUMBER: ${{ steps.build_state.outputs.build_number }}
          TEAK_IOS_VERSION: ${{ env.VERSION }}
        run: |
          bunx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install)
          pod_executable="$(pod env | awk -F': ' '/Executable Path/{print $2; exit}')"
          cocoapods_gem_home="$(cd "$(dirname "$pod_executable")/.." && pwd)"
          GEM_HOME="$cocoapods_gem_home" ruby scripts/configure-ios-signing.rb ios/Teak.xcodeproj
          xcodebuild -list -workspace ios/Teak.xcworkspace

      - name: Archive and export the production IPA on the GitHub runner
        id: ipa
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        working-directory: apps/mobile
        env:
          APPLE_DISTRIBUTION_IDENTITY: ${{ steps.signing.outputs.identity }}
          EXPO_PUBLIC_SENTRY_MOBILE_DSN: ${{ secrets.SENTRY_MOBILE_DSN }}
          IOS_APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_name }}
          IOS_EXTENSION_PROFILE_NAME: ${{ steps.profiles.outputs.extension_name }}
          SENTRY_ALLOW_FAILURE: "false"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: teakvault
          SENTRY_PROJECT: teak-mobile-prod
        run: |
          archive_path="$RUNNER_TEMP/Teak-iOS.xcarchive"
          export_path="$RUNNER_TEMP/Teak-iOS-export"
          xcodebuild \
            -workspace ios/Teak.xcworkspace \
            -scheme Teak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            archive

          export_options="$RUNNER_TEMP/iOSExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $APPLE_DISTRIBUTION_IDENTITY" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_APP_BUNDLE_ID string $IOS_APP_PROFILE_NAME" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_EXTENSION_BUNDLE_ID string $IOS_EXTENSION_PROFILE_NAME" "$export_options"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_count="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' | head -1)"
          if [ "$ipa_count" -ne 1 ] || [ ! -s "$ipa_path" ]; then
            echo "Expected exactly one non-empty locally exported IPA." >&2
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Verify the exact local IPA identity, version, build, profiles, and signature
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        env:
          BUILD_NUMBER: ${{ steps.build_state.outputs.build_number }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          entries="$RUNNER_TEMP/ios-ipa-entries.txt"
          unzip -Z1 "$IPA_PATH" > "$entries"
          app_info="$(grep -E '^Payload/[^/]+\.app/Info\.plist$' "$entries")"
          extension_info="$(grep -E '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/Info\.plist$' "$entries")"
          app_count="$(grep -Ec '^Payload/[^/]+\.app/Info\.plist$' "$entries")"
          extension_count="$(grep -Ec '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/Info\.plist$' "$entries")"
          if [ "$app_count" -ne 1 ] || [ "$extension_count" -ne 1 ]; then
            echo "Expected one app and one share extension in the IPA." >&2
            exit 1
          fi

          verify_info() {
            local entry="$1" expected_bundle="$2" prefix="$3"
            local plist="$RUNNER_TEMP/${prefix}-Info.plist"
            unzip -p "$IPA_PATH" "$entry" > "$plist"
            bundle_id="$(plutil -extract CFBundleIdentifier raw "$plist")"
            version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
            build_number="$(plutil -extract CFBundleVersion raw "$plist")"
            if [ "$bundle_id" != "$expected_bundle" ] || [ "$version" != "$VERSION" ] || [ "$build_number" != "$BUILD_NUMBER" ]; then
              echo "$prefix identity mismatch: $bundle_id $version ($build_number)." >&2
              exit 1
            fi
          }
          verify_info "$app_info" "$IOS_APP_BUNDLE_ID" app
          verify_info "$extension_info" "$IOS_EXTENSION_BUNDLE_ID" extension

          expanded="$RUNNER_TEMP/ios-ipa-expanded"
          unzip -q "$IPA_PATH" -d "$expanded"
          app_path="$(find "$expanded/Payload" -maxdepth 1 -type d -name '*.app' | head -1)"
          extension_path="$(find "$app_path/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -1)"
          main_bundle="$app_path/main.jsbundle"
          if [ ! -s "$main_bundle" ]; then
            echo "The signed app is missing its JavaScript bundle." >&2
            exit 1
          fi
          for expected_runtime_value in "$EXPO_PUBLIC_CONVEX_URL" "$EXPO_PUBLIC_CONVEX_SITE_URL"; do
            if ! grep -aFq "$expected_runtime_value" "$main_bundle"; then
              echo "The signed app is missing required production runtime configuration." >&2
              exit 1
            fi
          done
          codesign --verify --deep --strict "$app_path"
          codesign --verify --strict "$extension_path"
          app_entitlements="$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements :- "$app_path" > "$app_entitlements"
          keychain_access_group="$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$app_entitlements")"
          if [ "$keychain_access_group" != "$APPLE_TEAM_ID.$IOS_APP_BUNDLE_ID" ]; then
            echo "Signed app keychain access group mismatch: $keychain_access_group." >&2
            exit 1
          fi
          for item in "$app_path:$IOS_APP_BUNDLE_ID" "$extension_path:$IOS_EXTENSION_BUNDLE_ID"; do
            path="${item%%:*}"
            bundle_id="${item#*:}"
            security cms -D -i "$path/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
            if [ "$application_identifier" != "$APPLE_TEAM_ID.$bundle_id" ]; then
              echo "Embedded provisioning profile mismatch for $bundle_id." >&2
              exit 1
            fi
          done
          echo "- Local IPA: verified $VERSION/$BUILD_NUMBER for app and share extension" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA to mandatory Sentry Size Analysis on Apple Silicon
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry Size Analysis is mandatory and SENTRY_AUTH_TOKEN is missing." >&2
            exit 1
          fi
          if [ ! -s "$IPA_PATH" ]; then
            echo "Sentry Size Analysis requires the verified signed IPA." >&2
            exit 1
          fi
          bun run --cwd apps/mobile build:sentry -- "$IPA_PATH"

      - name: Prepare verified signed IPA handoff
        id: handoff
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        env:
          BUILD_NUMBER: ${{ steps.build_state.outputs.build_number }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          handoff_directory="$RUNNER_TEMP/ios-handoff"
          mkdir -p "$handoff_directory"
          handoff_ipa="$handoff_directory/$(basename "$IPA_PATH")"
          descriptor="$handoff_directory/ios-handoff.json"
          cp "$IPA_PATH" "$handoff_ipa"
          jq -n \
            --arg version "$VERSION" \
            --arg buildNumber "$BUILD_NUMBER" \
            --arg sha256 "$sha256" \
            --arg fileName "$(basename "$handoff_ipa")" \
            '{version: $version, buildNumber: $buildNumber, sha256: $sha256, fileName: $fileName}' > "$descriptor"
          echo "directory=$handoff_directory" >> "$GITHUB_OUTPUT"
          echo "descriptor=$descriptor" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified signed IPA handoff
        if: steps.release_state.outputs.mutate == 'true' && steps.build_state.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teak-ios-${{ env.VERSION }}-signed
          path: ${{ steps.handoff.outputs.directory }}
          if-no-files-found: error
          retention-days: 1

  submit:
    if: inputs.dry_run == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1.0.1
        with:
          cache: "false"
          version: ${{ env.ASC_VERSION }}

      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing App Store Connect credentials." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          asc auth status --validate --output table

      - name: Download verified signed IPA handoff
        if: needs.build.outputs.mutate == 'true' && needs.build.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teak-ios-${{ env.VERSION }}-signed
          path: ${{ runner.temp }}/ios-handoff

      - name: Verify signed IPA handoff
        id: handoff
        if: needs.build.outputs.mutate == 'true' && needs.build.outputs.reuse != 'true'
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          descriptor_count="$(find "$RUNNER_TEMP/ios-handoff" -maxdepth 1 -type f -name 'ios-handoff.json' | wc -l | tr -d ' ')"
          ipa_count="$(find "$RUNNER_TEMP/ios-handoff" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          descriptor="$(find "$RUNNER_TEMP/ios-handoff" -maxdepth 1 -type f -name 'ios-handoff.json')"
          ipa_path="$(find "$RUNNER_TEMP/ios-handoff" -maxdepth 1 -type f -name '*.ipa')"
          if [ "$descriptor_count" -ne 1 ] || [ "$ipa_count" -ne 1 ] || [ ! -s "$descriptor" ] || [ ! -s "$ipa_path" ]; then
            echo "Expected one signed IPA and its handoff descriptor." >&2
            exit 1
          fi
          jq -e --arg version "$VERSION" --arg build "$BUILD_NUMBER" \
            '.version == $version and .buildNumber == $build' "$descriptor" > /dev/null
          expected_sha="$(jq -r '.sha256' "$descriptor")"
          actual_sha="$(sha256sum "$ipa_path" | awk '{print $1}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Signed IPA handoff digest mismatch." >&2
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Upload local IPA with asc or reuse the exact valid Apple build
        id: apple_build
        if: needs.build.outputs.mutate == 'true'
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          EXISTING_BUILD_ID: ${{ needs.build.outputs.build_id }}
          IPA_PATH: ${{ steps.handoff.outputs.path }}
          REUSE: ${{ needs.build.outputs.reuse }}
        run: |
          build_id="$EXISTING_BUILD_ID"
          builds_path="$RUNNER_TEMP/apple-ios-builds.json"
          if [ "$REUSE" != "true" ]; then
            asc builds upload \
              --app "$ASC_APP_ID" \
              --ipa "$IPA_PATH" \
              --version "$VERSION" \
              --build-number "$BUILD_NUMBER" \
              --checksum \
              --wait \
              --output json > "$RUNNER_TEMP/ios-upload.json"
          fi
          asc builds list \
            --app "$ASC_APP_ID" \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --processing-state VALID \
            --exclude-expired \
            --output json > "$builds_path"
          resolved_build_id="$(jq -r '.data[0].id // empty' "$builds_path")"
          if [ -z "$resolved_build_id" ] || [ "$(jq '.data | length' "$builds_path")" -ne 1 ]; then
            echo "Expected exactly one VALID iOS build for $VERSION/$BUILD_NUMBER." >&2
            exit 1
          fi
          if [ -n "$build_id" ] && [ "$resolved_build_id" != "$build_id" ]; then
            echo "The exact reusable App Store build changed unexpectedly." >&2
            exit 1
          fi
          echo "id=$resolved_build_id" >> "$GITHUB_OUTPUT"
          echo "- App Store build: $resolved_build_id ($VERSION/$BUILD_NUMBER, VALID)" >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate asc high-level release commands without mutation
        id: asc_parity
        if: needs.build.outputs.mutate == 'true'
        env:
          BUILD_ID: ${{ steps.apple_build.outputs.id }}
          IPA_PATH: ${{ steps.handoff.outputs.path }}
          REUSE: ${{ needs.build.outputs.reuse }}
          SOURCE_VERSION: ${{ needs.build.outputs.source_version }}
        run: |
          stage_exit=0
          asc release stage \
            --app "$ASC_APP_ID" \
            --version "$VERSION" \
            --build "$BUILD_ID" \
            --platform "$PLATFORM" \
            --copy-metadata-from "$SOURCE_VERSION" \
            --exclude-fields whatsNew \
            --strict-validate \
            --dry-run \
            --output json > "$RUNNER_TEMP/ios-release-stage-dry-run.json" || stage_exit=$?
          publish_exit="not_evaluated_on_reuse"
          if [ "$REUSE" != "true" ]; then
            publish_exit=0
            asc publish appstore \
              --app "$ASC_APP_ID" \
              --ipa "$IPA_PATH" \
              --version "$VERSION" \
              --platform "$PLATFORM" \
              --submit \
              --dry-run \
              --output json > "$RUNNER_TEMP/ios-publish-dry-run.json" || publish_exit=$?
          fi
          echo "stage_exit=$stage_exit" >> "$GITHUB_OUTPUT"
          echo "publish_exit=$publish_exit" >> "$GITHUB_OUTPUT"
          {
            echo "- asc release stage dry-run exit: $stage_exit"
            echo "- asc publish appstore dry-run exit: $publish_exit"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find or create the iOS version and preserve release metadata
        id: apple_version
        if: needs.build.outputs.mutate == 'true'
        env:
          SOURCE_VERSION: ${{ needs.build.outputs.source_version }}
          TARGET_ID: ${{ needs.build.outputs.target_id }}
        run: |
          version_id="$TARGET_ID"
          if [ -z "$version_id" ]; then
            if [ -z "$SOURCE_VERSION" ]; then
              echo "No prior live iOS version is available for metadata carry-forward." >&2
              exit 1
            fi
            asc versions create \
              --app "$ASC_APP_ID" \
              --version "$VERSION" \
              --platform "$PLATFORM" \
              --release-type AFTER_APPROVAL \
              --copy-metadata-from "$SOURCE_VERSION" \
              --exclude-fields whatsNew \
              --output json > "$RUNNER_TEMP/ios-version-create.json"
            version_id="$(jq -r '.id // empty' "$RUNNER_TEMP/ios-version-create.json")"
          fi
          if [ -z "$version_id" ]; then
            version_id="$(asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --version "$VERSION" --limit 1 --output json | jq -r '.data[0].id // empty')"
          fi
          if [ -z "$version_id" ]; then
            echo "Could not resolve iOS App Store version $VERSION." >&2
            exit 1
          fi
          asc versions update --version-id "$version_id" --release-type AFTER_APPROVAL --output json > "$RUNNER_TEMP/ios-version-update.json"
          localizations="$RUNNER_TEMP/ios-localizations.json"
          asc localizations list --version "$version_id" --paginate --output json > "$localizations"
          if [ "$(jq '.data | length' "$localizations")" -eq 0 ]; then
            echo "Metadata carry-forward produced no version localizations." >&2
            exit 1
          fi
          while IFS= read -r locale; do
            asc localizations update \
              --version "$version_id" \
              --locale "$locale" \
              --whats-new "$RELEASE_NOTES" > /dev/null
          done < <(jq -r '.data[].attributes.locale' "$localizations")
          source_id="$(asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --version "$SOURCE_VERSION" --limit 1 --output json | jq -r '.data[0].id // empty')"
          if ! asc review details-for-version --version-id "$version_id" --output json > "$RUNNER_TEMP/ios-review-target.json" 2>/dev/null; then
            asc review details-for-version --version-id "$source_id" --output json > "$RUNNER_TEMP/ios-review-source.json"
            review="$RUNNER_TEMP/ios-review-source.json"
            args=(review details-create --version-id "$version_id")
            for field in contactFirstName contactLastName contactEmail contactPhone notes; do
              value="$(jq -r --arg field "$field" '.data.attributes[$field] // .[$field] // empty' "$review")"
              case "$field" in
                contactFirstName) flag=--contact-first-name ;;
                contactLastName) flag=--contact-last-name ;;
                contactEmail) flag=--contact-email ;;
                contactPhone) flag=--contact-phone ;;
                notes) flag=--notes ;;
              esac
              if [ -n "$value" ]; then args+=("$flag" "$value"); fi
            done
            demo_required="$(jq -r '.data.attributes.demoAccountRequired // .demoAccountRequired // false' "$review")"
            if [ "$demo_required" = "true" ]; then
              echo "Source review details require sensitive demo credentials; refusing to expose or copy them." >&2
              exit 1
            fi
            args+=(--demo-account-required=false)
            asc "${args[@]}" > "$RUNNER_TEMP/ios-review-create.json"
          fi
          echo "id=$version_id" >> "$GITHUB_OUTPUT"
          echo "- App Store version: $version_id (AFTER_APPROVAL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Complete new Apple age-rating fields without changing the existing declaration
        if: needs.build.outputs.mutate == 'true'
        env:
          VERSION_ID: ${{ steps.apple_version.outputs.id }}
        run: |
          asc age-rating edit \
            --version-id "$VERSION_ID" \
            --social-media false \
            --social-media-age-restricted false > "$RUNNER_TEMP/ios-age-rating-edit.json"
          asc age-rating view \
            --version-id "$VERSION_ID" \
            --fields socialMedia,socialMediaAgeRestricted > "$RUNNER_TEMP/ios-age-rating-view.json"
          if ! jq -e '.data.attributes.socialMedia == false and .data.attributes.socialMediaAgeRestricted == false' "$RUNNER_TEMP/ios-age-rating-view.json" > /dev/null; then
            echo "App Store Connect did not retain the required iOS social-media age-rating declarations." >&2
            exit 1
          fi
      - name: Attach exact build, validate, run doctor, and submit
        id: submit
        if: needs.build.outputs.mutate == 'true'
        env:
          BUILD_ID: ${{ steps.apple_build.outputs.id }}
          CURRENT_STATE: ${{ needs.build.outputs.target_state }}
          VERSION_ID: ${{ steps.apple_version.outputs.id }}
        run: |
          attach_exit=0
          asc versions attach-build --version-id "$VERSION_ID" --build-id "$BUILD_ID" --output json > "$RUNNER_TEMP/ios-attach.json" || attach_exit=$?
          if [ "$attach_exit" -ne 0 ]; then
            asc versions view --version-id "$VERSION_ID" --include-build --output json > "$RUNNER_TEMP/ios-attached-version.json"
            if [ "$CURRENT_STATE" != "READY_FOR_REVIEW" ] || ! jq -e --arg version "$VERSION_ID" --arg build "$BUILD_ID" '.id == $version and .state == "READY_FOR_REVIEW" and .buildId == $build' "$RUNNER_TEMP/ios-attached-version.json" > /dev/null; then
              echo "Could not attach the exact iOS build to the target version." >&2
              exit "$attach_exit"
            fi
            echo "- Exact iOS build was already attached to the existing READY_FOR_REVIEW draft." >> "$GITHUB_STEP_SUMMARY"
          fi
          validate_exit=0
          asc validate --app "$ASC_APP_ID" --version-id "$VERSION_ID" --platform "$PLATFORM" --strict --output json > "$RUNNER_TEMP/ios-validate.json" || validate_exit=$?
          if [ "$validate_exit" -ne 0 ]; then
            if [ "$CURRENT_STATE" != "READY_FOR_REVIEW" ] || ! jq -e '
              .summary.errors == 1
              and .summary.blocking == 1
              and ([.remediation.steps[]? | select(.blocking == true) | .checkId] == ["version.state.editable"])
            ' "$RUNNER_TEMP/ios-validate.json" > /dev/null; then
              echo "asc validate found unexpected iOS submission blockers." >&2
              exit "$validate_exit"
            fi
            echo "asc validate confirmed the only blocker is the expected existing READY_FOR_REVIEW draft." >> "$GITHUB_STEP_SUMMARY"
          fi
          doctor_exit=0
          asc review doctor --app "$ASC_APP_ID" --version-id "$VERSION_ID" --platform "$PLATFORM" --output json > "$RUNNER_TEMP/ios-doctor.json" || doctor_exit=$?
          if [ "$doctor_exit" -ne 0 ]; then
            if [ "$CURRENT_STATE" != "READY_FOR_REVIEW" ] || ! jq -e '
              .summary.errors == 1
              and .summary.blocking == 1
              and ([.blockingChecks[]?.id] == ["version.state.editable"])
            ' "$RUNNER_TEMP/ios-doctor.json" > /dev/null; then
              echo "asc review doctor found unexpected iOS submission blockers." >&2
              exit "$doctor_exit"
            fi
            echo "asc review doctor confirmed the only blocker is the expected existing READY_FOR_REVIEW draft." >> "$GITHUB_STEP_SUMMARY"
          fi
          ready_submissions="$RUNNER_TEMP/ios-ready-submissions.json"
          asc review submissions-list \
            --app "$ASC_APP_ID" \
            --platform "$PLATFORM" \
            --state READY_FOR_REVIEW \
            --paginate \
            --output json > "$ready_submissions"
          matching_submission=""
          empty_submission=""
          while IFS= read -r candidate_id; do
            candidate_items="$RUNNER_TEMP/ios-review-items-$candidate_id.json"
            asc review items-list \
              --submission "$candidate_id" \
              --fields appStoreVersion \
              --include appStoreVersion \
              --paginate \
              --output json > "$candidate_items"
            item_count="$(jq '.data | length' "$candidate_items")"
            target_count="$(jq --arg target "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id == $target)] | length' "$candidate_items")"
            if [ "$target_count" -eq 1 ] && [ "$item_count" -eq 1 ]; then
              if [ -n "$matching_submission" ] && [ "$matching_submission" != "$candidate_id" ]; then
                echo "Multiple READY_FOR_REVIEW submissions contain iOS version $VERSION_ID." >&2
                exit 1
              fi
              matching_submission="$candidate_id"
            elif [ "$item_count" -eq 0 ] && [ -z "$empty_submission" ]; then
              empty_submission="$candidate_id"
            fi
          done < <(jq -r '.data[]?.id' "$ready_submissions")
          submission_id="$matching_submission"
          if [ -z "$submission_id" ]; then
            submission_id="$empty_submission"
            if [ -z "$submission_id" ]; then
              asc review submissions-create --app "$ASC_APP_ID" --platform "$PLATFORM" --output json > "$RUNNER_TEMP/ios-submission-create.json"
              submission_id="$(jq -r '.data.id // .id // empty' "$RUNNER_TEMP/ios-submission-create.json")"
            fi
            if [ -z "$submission_id" ]; then
              echo "Could not resolve an iOS review submission." >&2
              exit 1
            fi
            asc review items-add \
              --submission "$submission_id" \
              --item-type appStoreVersions \
              --item-id "$VERSION_ID" > "$RUNNER_TEMP/ios-review-item-add.json"
          fi
          asc review items-list \
            --submission "$submission_id" \
            --fields appStoreVersion \
            --include appStoreVersion \
            --paginate \
            --output json > "$RUNNER_TEMP/ios-review-items-final.json"
          if ! jq -e --arg target "$VERSION_ID" '.data | length == 1 and .[0].relationships.appStoreVersion.data.id == $target' "$RUNNER_TEMP/ios-review-items-final.json" > /dev/null; then
            echo "Refusing to submit an iOS review draft that is empty or contains unrelated items." >&2
            exit 1
          fi
          asc review submissions-submit --id "$submission_id" --confirm --output json > "$RUNNER_TEMP/ios-submit.json"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"

      - name: Prove exact iOS release and publish manifest
        id: proof
        env:
          BUILD_ID: ${{ steps.apple_build.outputs.id }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          MANIFEST_NAME: teak-ios-${{ env.VERSION }}-app-store.json
          MUTATE: ${{ needs.build.outputs.mutate }}
          PUBLISH_EXIT: ${{ steps.asc_parity.outputs.publish_exit || 'not_run' }}
          STAGE_EXIT: ${{ steps.asc_parity.outputs.stage_exit || 'not_run' }}
          TARGET_ID: ${{ needs.build.outputs.target_id }}
          VERSION_ID: ${{ steps.apple_version.outputs.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_id="$VERSION_ID"
          build_id="$BUILD_ID"
          build_number="$BUILD_NUMBER"
          submission_id="${{ steps.submit.outputs.submission_id }}"
          prior_manifest="$RUNNER_TEMP/prior-ios-manifest.json"
          if [ "$MUTATE" != "true" ]; then
            version_id="$TARGET_ID"
            if ! gh release download "v$VERSION" --pattern "$MANIFEST_NAME" --output "$prior_manifest"; then
              echo "A read-only rerun requires the existing release manifest $MANIFEST_NAME." >&2
              exit 1
            fi
            build_id="$(jq -r '.build.id' "$prior_manifest")"
            build_number="$(jq -r '.build.number' "$prior_manifest")"
            submission_id="$(jq -r '.submission.id' "$prior_manifest")"
          elif [ "${{ needs.build.outputs.reuse }}" = "true" ]; then
            if ! gh release download "v$VERSION" --pattern "$MANIFEST_NAME" --output "$prior_manifest"; then
              echo "Reusing an existing Apple build requires its canonical release manifest." >&2
              exit 1
            fi
          fi
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --version "$VERSION" --limit 1 --output json > "$RUNNER_TEMP/ios-final-version.json"
            final_state="$(jq -r '.data[0].attributes.appVersionState // .data[0].attributes.appStoreState // empty' "$RUNNER_TEMP/ios-final-version.json")"
            case "$final_state" in
              WAITING_FOR_REVIEW|IN_REVIEW|PENDING_APPLE_RELEASE|PROCESSING_FOR_DISTRIBUTION|READY_FOR_DISTRIBUTION|READY_FOR_SALE)
                break
                ;;
              DEVELOPER_REJECTED|REJECTED|METADATA_REJECTED|INVALID_BINARY)
                echo "iOS $VERSION entered terminal state $final_state." >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          if ! [[ "$final_state" =~ ^(WAITING_FOR_REVIEW|IN_REVIEW|PENDING_APPLE_RELEASE|PROCESSING_FOR_DISTRIBUTION|READY_FOR_DISTRIBUTION|READY_FOR_SALE)$ ]]; then
            echo "Timed out waiting for iOS $VERSION to reach WAITING_FOR_REVIEW." >&2
            exit 1
          fi
          asc versions view --version-id "$version_id" --include-build --output json > "$RUNNER_TEMP/ios-final-view.json"
          asc builds info --build-id "$build_id" --output json > "$RUNNER_TEMP/ios-final-build.json"
          asc review submissions-get --id "$submission_id" --include appStoreVersionForReview --output json > "$RUNNER_TEMP/ios-final-submission.json"
          jq -n \
            --arg version "$VERSION" \
            --arg platform "$PLATFORM" \
            --arg versionId "$version_id" \
            --arg buildId "$build_id" \
            --arg buildNumber "$build_number" \
            --arg submissionId "$submission_id" \
            '{version: $version, platform: $platform, versionId: $versionId, buildId: $buildId, buildNumber: $buildNumber, submissionId: $submissionId}' \
            > "$RUNNER_TEMP/ios-expected.json"
          node scripts/apple-release-proof.mjs verify \
            --version-list "$RUNNER_TEMP/ios-final-version.json" \
            --version-view "$RUNNER_TEMP/ios-final-view.json" \
            --build "$RUNNER_TEMP/ios-final-build.json" \
            --submission "$RUNNER_TEMP/ios-final-submission.json" \
            --expected "$RUNNER_TEMP/ios-expected.json" \
            --output "$RUNNER_TEMP/ios-proof.json"
          artifact_sha="${{ steps.handoff.outputs.sha256 }}"
          sentry="success"
          prior_args=()
          if [ "$MUTATE" != "true" ] || [ "${{ needs.build.outputs.reuse }}" = "true" ]; then
            artifact_sha=""
            sentry=""
            prior_args=(--prior "$prior_manifest")
          fi
          node scripts/apple-release-manifest.mjs create \
            --proof "$RUNNER_TEMP/ios-proof.json" \
            --output "$RUNNER_TEMP/$MANIFEST_NAME" \
            --tag "v$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --app-id "$ASC_APP_ID" \
            --artifact-name "Teak-$VERSION.ipa" \
            --artifact-sha "$artifact_sha" \
            --sentry "$sentry" \
            --asc-version "$ASC_VERSION" \
            --stage-exit "$STAGE_EXIT" \
            --publish-exit "$PUBLISH_EXIT" \
            --workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${prior_args[@]}"

          for attempt in 1 2 3 4 5 6; do
            if gh release view "v$VERSION" > /dev/null 2>&1; then break; fi
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes > /dev/null 2>&1 || true
            if [ "$attempt" -eq 6 ]; then
              echo "Could not resolve GitHub Release v$VERSION." >&2
              exit 1
            fi
            sleep 10
          done
          gh release upload "v$VERSION" "$RUNNER_TEMP/$MANIFEST_NAME" --clobber
          {
            echo "- Review submission: $submission_id"
            echo "- Final iOS state: $final_state"
            echo "- Release: automatic after approval"
            echo "- Manifest: $MANIFEST_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    if: ${{ always() && inputs.dry_run == false && (needs.build.result == 'failure' || needs.submit.result == 'failure') }}
    needs: [build, submit]
    runs-on: ubuntu-24.04
    concurrency:
      group: apple-release-issue-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1.0.1
        with:
          cache: "false"
          version: ${{ env.ASC_VERSION }}
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Capture redacted asc diagnostics
        run: |
          asc status --app "$ASC_APP_ID" > "$RUNNER_TEMP/ios-status.txt" 2>&1 || true
          asc review doctor --app "$ASC_APP_ID" --version "$VERSION" --platform "$PLATFORM" > "$RUNNER_TEMP/ios-doctor.txt" 2>&1 || true
      - name: Open or update the release issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/apple-release-issue.mjs failure \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --app-id "$ASC_APP_ID" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --status-file "$RUNNER_TEMP/ios-status.txt" \
            --doctor-file "$RUNNER_TEMP/ios-doctor.txt"
