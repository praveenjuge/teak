name: Apple Release Status

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check; defaults to root package.json"
        required: false
        type: string
      dry_run:
        description: "Read Apple state without updating a release issue"
        required: true
        default: false
        type: boolean

concurrency:
  group: apple-release-status-${{ inputs.version || 'current' }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

env:
  ASC_BYPASS_KEYCHAIN: "1"
  ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
  ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  ASC_NO_UPDATE: "1"
  ASC_VERSION: "3.6.1"
  IOS_APP_ID: "6756574989"
  # The native app's Mac version lives on the same listing as iOS (Teak for
  # Mac, 6770003409, is off sale). Apple's public lookup reports one version
  # per listing, so the Mac storefront column shows the listing's version.
  SAFARI_APP_ID: "6756574989"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: apple-release-issue-${{ inputs.version || 'current' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Set up asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1.0.1
        with:
          cache: "false"
          version: ${{ env.ASC_VERSION }}

      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing App Store Connect credentials." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Check every pending Apple release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          UPDATE_ISSUES: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          root_version="$(node -p "require('./package.json').version")"
          if [ -n "$REQUESTED_VERSION" ]; then
            node scripts/release/release-version.ts version "$REQUESTED_VERSION"
            versions="$(jq -cn --arg version "$REQUESTED_VERSION" '[$version]')"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Every open release issue, and always the version on main: a
            # release that succeeds leaves no issue behind.
            versions="$(node scripts/release/apple-release-issue.ts versions | jq -c --arg version "$root_version" '. + [$version] | unique')"
          else
            versions="$(jq -cn --arg version "$root_version" '[$version]')"
          fi
          asc auth status --validate --output table
          while IFS= read -r version; do
            node scripts/release/release-version.ts version "$version"
            ios_path="$RUNNER_TEMP/ios-version-$version.json"
            safari_path="$RUNNER_TEMP/safari-version-$version.json"
            for attempt in 1 2 3; do
              if asc versions list --app "$IOS_APP_ID" --platform IOS --version "$version" --limit 1 --output json > "$ios_path" && \
                asc versions list --app "$SAFARI_APP_ID" --platform MAC_OS --version "$version" --limit 1 --output json > "$safari_path"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 10))
            done
            ios_state="$(jq -r '.data[0].attributes.appVersionState // .data[0].attributes.appStoreState // "NOT_CREATED"' "$ios_path")"
            safari_state="$(jq -r '.data[0].attributes.appVersionState // .data[0].attributes.appStoreState // "NOT_CREATED"' "$safari_path")"
            ios_id="$(jq -r '.data[0].id // "n/a"' "$ios_path")"
            safari_id="$(jq -r '.data[0].id // "n/a"' "$safari_path")"

            ios_store="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              "https://itunes.apple.com/lookup?id=$IOS_APP_ID&country=us" | jq -r '.results[0].version // "NOT_LIVE"')"
            safari_store="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              "https://itunes.apple.com/lookup?id=$SAFARI_APP_ID&country=us" | jq -r '.results[0].version // "NOT_LIVE"')"
            {
              echo "### Apple release v$version"
              echo "- iOS: $ios_state ($ios_id); storefront $ios_store"
              echo "- Safari macOS: $safari_state ($safari_id); storefront $safari_store"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$UPDATE_ISSUES" = "true" ]; then
              node scripts/release/apple-release-issue.ts status \
                --version "$version" \
                --ios-state "$ios_state" \
                --ios-store-version "$ios_store" \
                --safari-state "$safari_state" \
                --safari-store-version "$safari_store" \
                --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi

            # The schedule ships the Mac once iOS is live: only for the version
            # on main, which the release must build from (the next release
            # replaces an older one), and once per version (a run that fails
            # reports to the release issue instead of retrying here).
            mac_due="$(node scripts/release/apple-release-issue.ts mac-due --ios-state "$ios_state" --safari-state "$safari_state")"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$version" = "$root_version" ] && [ "$mac_due" = "true" ]; then
              mac_runs="$(gh run list --workflow apple-release.yml --limit 1000 --json displayTitle \
                --jq "[.[] | select(.displayTitle == \"Apple Mac $version (release)\" or .displayTitle == \"Apple iOS + Mac $version (release)\")] | length")"
              if [ "$mac_runs" = "0" ]; then
                gh workflow run apple-release.yml --ref main -f "version=$version" -f platforms=macos -f dry_run=false
                echo "- Started the Mac release: iOS is live." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done < <(jq -r '.[]' <<< "$versions")
