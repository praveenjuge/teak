# Guards the Convex runtime boundary on backend changes: isolate modules may
# never import "use node" modules. The production deploy catches this at
# bundle time; run the guard on PRs so the failure surfaces before merge.
name: Convex Guards

on:
  pull_request:
    paths:
      - ".github/workflows/convex-test.yml"
      - "packages/convex/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/convex-test.yml"
      - "packages/convex/**"

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run Convex Node-runtime boundary tests
        working-directory: packages/convex
        run: bun test __tests__/telemetry/node-runtime.test.ts
