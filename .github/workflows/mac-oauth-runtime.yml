name: Mac OAuth Runtime

on:
  pull_request:
    paths:
      - apps/mac/**
      - scripts/test-mac-oauth.sh
      - .github/workflows/mac-oauth-runtime.yml
  push:
    branches: [main]
    paths:
      - apps/mac/**
      - scripts/test-mac-oauth.sh
      - .github/workflows/mac-oauth-runtime.yml

permissions:
  contents: read

concurrency:
  group: mac-oauth-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-runtime:
    runs-on: macos-26
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify development and production configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/mac-oauth
          bash scripts/test-mac-oauth.sh debug 2>&1 | tee test-results/mac-oauth/debug.log
          bash scripts/test-mac-oauth.sh release 2>&1 | tee test-results/mac-oauth/release.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mac-oauth-runtime
          path: test-results/mac-oauth
          retention-days: 14
