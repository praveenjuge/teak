name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "packages/convex/**"
      - "packages/files-protocol/**"
      - "apps/files-worker/**"
      - "scripts/check-files-readiness.ts"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Verify deployment credentials
        run: |
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$POSTHOG_PROJECT_TOKEN"
      - name: Wait for compatible files worker
        run: bun run scripts/check-files-readiness.ts --prod --wait
      - name: Resolve build metadata
        run: |
          release="$(bun --no-env-file run scripts/build-metadata.ts --release teak-backend)"
          echo "TEAK_BACKEND_RELEASE=$release" >> "$GITHUB_ENV"
          echo "TEAK_BACKEND_SHA=${release#teak-backend@}" >> "$GITHUB_ENV"
      - name: Configure backend release context
        working-directory: packages/convex
        run: |
          bunx convex env set POSTHOG_PROJECT_TOKEN "$POSTHOG_PROJECT_TOKEN"
          bunx convex env set CONVEX_GIT_COMMIT_SHA "$TEAK_BACKEND_SHA"
      - name: Typecheck Convex backend (including regenerated declarations)
        working-directory: packages/convex
        run: |
          bunx convex codegen
          bun run typecheck
      - name: Deploy Convex production
        working-directory: packages/convex
        run: |
          bunx convex deploy \
            --typecheck disable \
            --message "$TEAK_BACKEND_RELEASE"
