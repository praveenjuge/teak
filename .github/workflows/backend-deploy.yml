name: Backend Deploy

on:
  push:
    branches: [main]
    # scripts/repo/workflow-paths.test.ts checks this covers every file the
    # Convex modules import.
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "packages/convex/**"
      - "packages/files-protocol/**"
      - "packages/i18n/**"
      - "apps/core-worker/**"
      - "scripts/setup/check-files-readiness.ts"
      - "scripts/release/release-cli.ts"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Verify deployment credentials
        run: |
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$POSTHOG_PROJECT_TOKEN"
      - name: Wait for compatible core worker
        run: bun run scripts/setup/check-files-readiness.ts --prod --wait
      - name: Resolve build metadata
        run: |
          release="$(bun --no-env-file run scripts/release/build-metadata.ts --release teak-backend)"
          echo "TEAK_BACKEND_RELEASE=$release" >> "$GITHUB_ENV"
          echo "TEAK_BACKEND_SHA=${release#teak-backend@}" >> "$GITHUB_ENV"
      - name: Configure backend release context
        working-directory: packages/convex
        run: |
          bunx convex env set POSTHOG_PROJECT_TOKEN "$POSTHOG_PROJECT_TOKEN"
          bunx convex env set CONVEX_GIT_COMMIT_SHA "$TEAK_BACKEND_SHA"
      - name: Typecheck Convex backend (including regenerated declarations)
        working-directory: packages/convex
        run: |
          bunx convex codegen
          bun run typecheck
      - name: Deploy Convex production
        working-directory: packages/convex
        run: |
          bunx convex deploy \
            --typecheck disable \
            --message "$TEAK_BACKEND_RELEASE"
