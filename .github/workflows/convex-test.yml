# Guards the Convex runtime boundary on backend changes: isolate modules may
# never import "use node" modules. The production deploy catches this at
# bundle time; run the guard on PRs so the failure surfaces before merge.
name: Convex Guards

on:
  pull_request:
    paths:
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/convex-test.yml"
      - "packages/convex/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/convex-test.yml"
      - "packages/convex/**"

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Run Convex Node-runtime boundary tests
        working-directory: packages/convex
        run: bun test __tests__/telemetry/node-runtime.test.ts
