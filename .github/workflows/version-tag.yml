name: Version Tag

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"

concurrency:
  group: version-tag-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read root version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Verify every package.json is lockstep
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-version.mjs lockstep "$VERSION"

      - name: Detect and verify release version change
        id: version-change
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous_version="$(git show HEAD^:package.json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).version));')"
          if [ "$previous_version" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Root version is unchanged at $VERSION; no release tag is needed."
            exit 0
          fi
          node scripts/release-version.mjs patch "$previous_version" "$VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        id: tag
        if: steps.version-change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "$TAG_NAME already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflows
        if: steps.version-change.outputs.changed == 'true' && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run cli-release.yml --ref "$TAG_NAME"
          gh workflow run desktop-release.yml --ref "$TAG_NAME"
          gh workflow run extension-release.yml --ref "$TAG_NAME"
          gh workflow run mobile-release.yml --ref "$TAG_NAME" -f "version=${VERSION}" -f "dry_run=false"
          gh workflow run safari-extension-release.yml --ref "$TAG_NAME" -f "version=${VERSION}" -f "dry_run=false"
