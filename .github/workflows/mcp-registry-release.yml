name: MCP Registry Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: mcp-registry-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_NAME: com.teakvault/mcp
  # Pinned and checked with cosign, as the registry's GitHub Actions guide asks.
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./server.json').version")"
          fi
          server_version="$(node -p "require('./server.json').version")"
          if [ "$server_version" != "$version" ]; then
            echo "Release version ($version) does not match server.json version ($server_version)." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The registry refuses a version it already has, so a rerun after a
      # successful publish passes here instead of failing.
      - name: Check if version is already in the registry
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          encoded="${SERVER_NAME//\//%2F}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions/${VERSION}")"
          case "$status" in
            200)
              echo "$SERVER_NAME $VERSION is already in the registry."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The registry answered $status for $SERVER_NAME $VERSION." >&2
              exit 1
              ;;
          esac

      - name: Check the signing key is set
        if: steps.check.outputs.should_publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "Missing MCP_PRIVATE_KEY. See \"MCP Registry and Claude directory\" in .agents/runbooks/releases.md." >&2
            exit 1
          fi

      - name: Install cosign
        if: steps.check.outputs.should_publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.check.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        if: steps.check.outputs.should_publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          # The secret is the key's 32-byte seed as hex; a stored newline is dropped.
          private_key="$(printf '%s' "$MCP_PRIVATE_KEY" | tr -d '[:space:]')"
          ./mcp-publisher login dns --domain teakvault.com --private-key "$private_key"
          ./mcp-publisher publish

      - name: Confirm the version is listed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          encoded="${SERVER_NAME//\//%2F}"
          for _ in {1..10}; do
            if curl --silent --fail --output /dev/null \
              "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions/${VERSION}"; then
              echo "- MCP Registry: $SERVER_NAME $VERSION is listed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "$SERVER_NAME $VERSION isn't listed in the registry." >&2
          exit 1
