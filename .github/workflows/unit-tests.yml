name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint backend identity boundary
        run: bun run --cwd packages/convex lint
      - name: Run unit tests
        run: bun run test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install the Android 17 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Lint, unit tests and a release build
        run: ./gradlew lint testDebugUnitTest :app:assembleRelease --console=plain

  apple:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Xcode 27
        run: scripts/select-xcode.sh
      - name: Check the Xcode project matches project.yml
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          scripts/generate-project.sh --check
      - name: TeakKit tests
        run: swift test --package-path Packages/TeakKit
      - name: Build for iPhone, iPad and Mac
        run: |
          for destination in "generic/platform=iOS Simulator" "generic/platform=macOS"; do
            xcodebuild build -project Teak.xcodeproj -scheme Teak -destination "$destination" \
              -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
          done
