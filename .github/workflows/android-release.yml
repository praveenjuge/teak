name: Android Release
run-name: Android ${{ inputs.version || github.ref_name }}${{ github.ref_type != 'tag' && inputs.dry_run && ' (dry run)' || '' }}

# Each version tag builds the signed bundle once, then submits it to Google
# Play: the internal and production tracks at full rollout, with the listing
# from apps/android/store/store.config.json. See apps/android/release.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (its v<version> tag must exist); defaults to the root package.json"
        required: false
        type: string
      release_notes:
        description: "Play release notes for this run (defaults to whatsNew in apps/android/store/store.config.json)"
        required: false
        type: string
      dry_run:
        description: "Validate everything in a Play edit without submitting it (ignored on a tag)"
        required: true
        default: true
        type: boolean

concurrency:
  # A tag push and a dispatch naming the same version share one group, so
  # the tag never builds twice at once.
  group: android-release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  POSTHOG_CLI_VERSION: "0.18.10"
  POSTHOG_CLI_HOST: https://us.posthog.com
  # The upload certificate in apps/android/release.md; Play rejects any other.
  UPLOAD_CERT_SHA256: "5C:3E:DD:C4:BE:80:5D:6F:F6:CC:7E:38:A2:92:6A:AD:9E:55:86:10:A3:5E:18:ED:F6:A3:B8:47:93:1D:1C:11"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag always publishes. A dispatch publishes only from that tag or
      # from current main that contains it; a dry run may start anywhere.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a version like 1.0.93, not $version." >&2
            exit 1
          fi
          release_tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)"
          if [ -z "$tag_commit" ]; then
            echo "The $release_tag tag doesn't exist." >&2
            exit 1
          fi
          dry_run=false
          if [[ "$GITHUB_REF_TYPE" != "tag" && "$INPUT_DRY_RUN" == "true" ]]; then dry_run=true; fi
          if [ "$dry_run" = false ]; then
            case "$GITHUB_REF" in
              "refs/tags/$release_tag") ;;
              refs/heads/main)
                if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ] || ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
                  echo "A real release from main must run on current main, which must contain $release_tag." >&2
                  exit 1
                fi
                ;;
              *)
                echo "A real release may run only from $release_tag or current main, not $GITHUB_REF." >&2
                exit 1
                ;;
            esac
          fi
          IFS=. read -r major minor patch <<< "$version"
          {
            echo "version=$version"
            echo "version_code=$((major * 1000000 + minor * 1000 + patch))"
            echo "tag=$release_tag"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      # Each tag builds once: the bundle on the release is the one whose
      # mapping PostHog has, so a rerun must not replace it with a new build.
      - name: Check if version already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          expected_asset="teak-android-${VERSION}.aab"
          if gh release view "$TAG_NAME" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$expected_asset"; then
            echo "Release $TAG_NAME already has $expected_asset; skipping the Android build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release secrets
        if: steps.check.outputs.should_run == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
        run: |
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            POSTHOG_PROJECT_TOKEN POSTHOG_CLI_API_KEY POSTHOG_CLI_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}. See \"One-time setup\" in apps/android/release.md." >&2
            exit 1
          fi

      - name: Set up Java
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.check.outputs.should_run == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A release build starts clean, so nothing from a cache reaches the bundle.
          cache-disabled: true

      - name: Install the Android SDK
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/setup-android-sdk

      - name: Set up Node
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Install posthog-cli
        if: steps.check.outputs.should_run == 'true'
        run: npm install --global "@posthog/cli@${POSTHOG_CLI_VERSION}"

      - name: Restore the upload key
        if: steps.check.outputs.should_run == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/teak-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "TEAK_UPLOAD_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      # The PostHog Gradle plugin uploads the R8 mapping as part of the
      # release bundle, tagged with the map ID the bundle carries.
      - name: Lint, unit tests and the signed release bundle
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/android
        env:
          TEAK_UPLOAD_KEY_ALIAS: upload
          TEAK_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          POSTHOG_ANDROID_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
        run: |
          set -o pipefail
          ./gradlew clean lint testDebugUnitTest :app:bundleRelease --console=plain | tee "$RUNNER_TEMP/gradle.log"
          if ! grep -q '^> Task :app:uploadPostHogProguardMappingsRelease$' "$RUNNER_TEMP/gradle.log"; then
            echo "The R8 mapping upload to PostHog didn't run." >&2
            exit 1
          fi

      - name: Verify the bundle
        id: bundle
        if: steps.check.outputs.should_run == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          VERSION_CODE: ${{ needs.resolve.outputs.version_code }}
        run: |
          bundle="apps/android/app/build/outputs/bundle/release/app-release.aab"
          mapping="apps/android/app/build/outputs/mapping/release/mapping.txt"
          jarsigner -verify "$bundle" > /dev/null
          fingerprint="$(keytool -printcert -jarfile "$bundle" | awk '/SHA256:/ {print $2; exit}')"
          if [ "$fingerprint" != "$UPLOAD_CERT_SHA256" ]; then
            echo "The bundle is signed with $fingerprint, not the upload key." >&2
            exit 1
          fi
          manifest="$(unzip -p "$bundle" base/manifest/AndroidManifest.xml | strings)"
          if ! grep -q "$VERSION_CODE" <<< "$manifest"; then
            echo "The bundle's manifest doesn't carry version code $VERSION_CODE." >&2
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$bundle" "$out/teak-android-${VERSION}.aab"
          cp "$mapping" "$out/teak-android-${VERSION}-mapping.txt"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          {
            echo "- Android: teak-android-${VERSION}.aab, version code $VERSION_CODE, signed with the upload key"
            echo "- PostHog: R8 mapping uploaded"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the bundle and mapping to the GitHub release
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          OUT: ${{ steps.bundle.outputs.dir }}
        run: |
          # Version Tag creates the release with the tag.
          node scripts/release/github-release.ts wait "$GITHUB_REPOSITORY" "$TAG_NAME"
          gh release upload "$TAG_NAME" "$OUT/teak-android-${VERSION}.aab" "$OUT/teak-android-${VERSION}-mapping.txt" --clobber

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/teak-upload.jks"

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One real Play edit at a time for the app; a newer release waits, then
    # wins. Dry runs stay out of the queue so they never displace a pending
    # release (GitHub keeps only the newest pending job in a group).
    concurrency:
      group: ${{ needs.resolve.outputs.dry_run == 'true' && format('play-dry-run-{0}', github.run_id) || 'play-publish-com.praveenjuge.teak' }}
      cancel-in-progress: false

    steps:
      # The listing and release notes come from this ref: the tag for a tag
      # push, current main (or a branch, for a dry run) for a dispatch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the Play secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret PLAY_SERVICE_ACCOUNT_JSON. See \"One-time setup\" in apps/android/release.md." | tee "$RUNNER_TEMP/play-error.txt" >&2
            exit 1
          fi

      # Play gets the exact bundle on the GitHub Release, the one whose
      # mapping PostHog has.
      - name: Download and check the release bundle
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/play"
          mkdir -p "$dir"
          gh release download "$TAG_NAME" --dir "$dir" \
            -p "teak-android-${VERSION}.aab" -p "teak-android-${VERSION}-mapping.txt"
          jarsigner -verify "$dir/teak-android-${VERSION}.aab" > /dev/null
          fingerprint="$(keytool -printcert -jarfile "$dir/teak-android-${VERSION}.aab" | awk '/SHA256:/ {print $2; exit}')"
          if [ "$fingerprint" != "$UPLOAD_CERT_SHA256" ]; then
            echo "The release bundle is signed with $fingerprint, not the upload key." | tee "$RUNNER_TEMP/play-error.txt" >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          DIR: ${{ steps.assets.outputs.dir }}
        run: |
          node scripts/release/play-publish.ts publish \
            --version "$VERSION" \
            --bundle "$DIR/teak-android-${VERSION}.aab" \
            --mapping "$DIR/teak-android-${VERSION}-mapping.txt" \
            --dry-run "$DRY_RUN" \
            --proof "$DIR/teak-android-${VERSION}-play.json" \
            --error-file "$RUNNER_TEMP/play-error.txt"

      - name: Attach the Play proof and close any release issue
        if: needs.resolve.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PROOF: ${{ steps.assets.outputs.dir }}/teak-android-${{ needs.resolve.outputs.version }}-play.json
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No proof means production already served a newer version, or the
          # read-back failed after Play accepted the release (a warning).
          if [ -f "$PROOF" ]; then
            gh release upload "$TAG_NAME" "$PROOF" --clobber
          fi
          node scripts/release/android-release-issue.ts resolved --version "$VERSION" --workflow-url "$WORKFLOW_URL"

      - name: Keep the error for the release issue
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-error
          path: ${{ runner.temp }}/play-error.txt
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [resolve, build, publish]
    if: failure() && needs.resolve.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Download the Play error
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: play-error
          path: ${{ runner.temp }}/play-error

      - name: Open or update the release issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/release/android-release-issue.ts failure \
            --version "$VERSION" \
            --workflow-url "$WORKFLOW_URL" \
            --error-file "$RUNNER_TEMP/play-error/play-error.txt"
