name: Extension OAuth Runtime

on:
  pull_request:
    # scripts/repo/workflow-paths.test.ts checks this covers every file the
    # hermetic OAuth specs load.
    paths: &oauth-runtime-paths
      - apps/extension/**
      - packages/sdk/src/**
      - packages/convex/_generated/api.js
      - packages/convex/devUrls.ts
      - packages/convex/index.ts
      - packages/convex/shared/**
      - packages/files-protocol/src/**
      - packages/i18n/src/**
      - packages/i18n/messages/**
      - packages/tests/src/stack/config.ts
      - scripts/dev/proc.ts
      - scripts/dev/worktree-env.ts
      - scripts/dev/production-surfaces.ts
      - scripts/deployments.json
      - scripts/lib/stack-state.ts
      - scripts/lib/teak-account.ts
      - packages/tests/src/extension/oauth-runtime.e2e.ts
      - packages/tests/src/auth-runtime/**
      - packages/tests/src/helpers/**
      - packages/tests/e2e.hermetic.config.ts
      - packages/tests/src/config/**
      - apps/web/src/components/settings/SecurityConnections.tsx
      - packages/tests/package.json
      - bun.lock
      - package.json
      - .github/actions/setup-bun/action.yml
      - .github/workflows/extension-oauth-runtime.yml
  push:
    branches: [main]
    paths: *oauth-runtime-paths

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: extension-oauth-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node: "true"
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file x e2e-web install --with-deps chromium
        working-directory: packages/tests
      - run: bun --no-env-file run --cwd packages/tests e2e:hermetic
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: hermetic-oauth-runtime
          path: packages/tests/.e2e/hermetic
          if-no-files-found: warn
          retention-days: 14
