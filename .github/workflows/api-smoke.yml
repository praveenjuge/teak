# Passes after the docs deployment has published the apex API/MCP rewrites.
name: API and MCP Smoke

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke (defaults to production)"
        required: false
        default: "https://teakvault.com"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'https://teakvault.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Smoke API and MCP URLs
        run: bash scripts/smoke-urls.sh
