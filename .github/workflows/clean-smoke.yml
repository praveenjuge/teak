name: Clean Container Smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: clean-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Assert clean dotenv state
        run: |
          test ! -e .env.local
          test ! -e apps/web/.env.local
          test ! -e apps/extension/.env.local
          test ! -e apps/files-worker/.dev.vars
          test ! -e packages/convex/.env.local
      - name: Setup check passes without secrets
        run: bun run setup --check
      - run: bun ci
      - name: Install Chromium
        working-directory: packages/tests
        run: bunx e2e-web install --with-deps chromium
      - name: Sign up, create and search on a fresh stack
        run: bun run --cwd packages/tests e2e src/matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-smoke-results
          path: |
            packages/tests/.e2e
            .agents/.state/stack.log
          if-no-files-found: warn
          retention-days: 7
