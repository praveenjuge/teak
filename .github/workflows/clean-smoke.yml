name: Clean Container Smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: clean-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_AGENT_MODE: anonymous
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Assert clean dotenv state
        run: |
          test ! -e .env.local
          test ! -e apps/web/.env.local
          test ! -e apps/desktop/.env.local
          test ! -e apps/extension/.env.local
          test ! -e apps/mobile/.env.local
          test ! -e apps/files-worker/.dev.vars
          test ! -e packages/convex/.env.local
      - name: Setup web target
        run: bun run setup --target web --convex local
      - name: Doctor JSON must pass
        run: |
          bun run --silent doctor --target web --profile local --json > /tmp/doctor.json
          cat /tmp/doctor.json
          test "$(jq -r .ok /tmp/doctor.json)" = "true"
      - name: Authenticated journey smoke
        run: |
          bun run dev web --headless > /tmp/dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2> /dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$dev_pid" 2> /dev/null; then
              break
            fi
            sleep 5
          done
          if ! curl -fsS http://localhost:3000/login > /dev/null; then
            tail -80 /tmp/dev.log
            exit 1
          fi
          if ! bun run smoke:web; then
            tail -80 /tmp/dev.log
            exit 1
          fi
