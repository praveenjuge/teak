name: Clean Container Smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: clean-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_UI: "false"
    # `bun run dev` needs the shared cloud dev deployment, which forks and
    # this runner can't reach, so setup is only checked here. The signed-in
    # smoke runs on the E2E suite's own stack: a local backend and the WorkOS
    # emulator with test-only values, so it needs no secrets.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Assert clean dotenv state
        run: |
          test ! -e .env.local
          test ! -e apps/web/.env.local
          test ! -e apps/extension/.env.local
          test ! -e apps/mobile/.env.local
          test ! -e apps/files-worker/.dev.vars
          test ! -e packages/convex/.env.local
      - name: Setup check passes without secrets
        run: bun run setup --check
      - run: bun ci
      - name: Install Playwright Chromium
        working-directory: packages/tests
        run: bunx playwright install --with-deps chromium
      - name: Sign up, create and search on a fresh stack
        run: bun run --cwd packages/tests e2e --project=matrix-chromium
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clean-smoke-results
          path: |
            packages/tests/playwright-report
            packages/tests/test-results
            .agents/.state/stack.log
          retention-days: 7
