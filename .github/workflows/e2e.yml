name: E2E

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      e2e_args:
        description: e2e run arguments, such as src/web or --grep editor. Empty runs the Chromium suite and the WebKit matrix.
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Install browsers
        working-directory: packages/tests
        run: bunx e2e-web install --with-deps chromium webkit
      - name: Run the E2E suite
        env:
          E2E_ARGS: ${{ inputs.e2e_args }}
          GITHUB_TOKEN: ${{ github.token }}
        # xargs splits the arguments like a shell, honoring quotes such as
        # --grep "ten warm", without expanding globs such as src/journey/*
        # or running anything in them.
        run: |
          if [ -z "$E2E_ARGS" ]; then
            bun run --cwd packages/tests e2e
          else
            printf '%s' "$E2E_ARGS" | xargs bun run --cwd packages/tests e2e
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            packages/tests/.e2e
            .agents/.state/stack.log
          if-no-files-found: warn
          retention-days: 7

  # XCUITest flows for the Apple app against the same local stack. The Mac
  # flows need a signed build, so CI runs iPhone and iPad.
  apple:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Select Xcode 27
        run: apps/apple/scripts/select-xcode.sh
      - name: Start the E2E stack
        run: |
          bun run --cwd packages/tests e2e:stack > "$RUNNER_TEMP/stack.out" 2>&1 &
          for _ in $(seq 1 180); do
            grep -q '"ready": true' .agents/.state/stack.json 2>/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/stack.out"
          exit 1
      - name: iPhone flows
        run: |
          device="$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9] Pro \(' | head -1 | sed 's/ ($//')"
          TEAK_IPHONE="$device" apps/apple/scripts/ui-tests.sh ios -resultBundlePath "$RUNNER_TEMP/iphone.xcresult"
      - name: iPad layout smoke test
        run: |
          device="$(xcrun simctl list devices available | grep -oE 'iPad Pro 13-inch \([^)]*\)' | head -1)"
          TEAK_IPAD="$device" apps/apple/scripts/ui-tests.sh ipad \
            -only-testing:TeakUITests/SignInTests -only-testing:TeakUITests/LibraryFlowTests/testNotesLinksSearchAndTokens \
            -resultBundlePath "$RUNNER_TEMP/ipad.xcresult"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-apple-results
          path: |
            ${{ runner.temp }}/*.xcresult
            .agents/.state/stack.log
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The e2e CLI runs on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --filter @teak/tests
      - name: Install Chromium
        working-directory: packages/tests
        run: bunx e2e-web install --with-deps chromium
      - run: bun run --cwd packages/tests e2e:docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-docs-results
          path: packages/tests/.e2e/docs
          if-no-files-found: warn
          retention-days: 7
